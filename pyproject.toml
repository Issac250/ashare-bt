[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashare-bt"
version = "0.1.0"
description = "A cross-sectional backtester for China A-shares that only fills orders the exchange would have filled."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Issac250" }]
dependencies = ["numpy>=1.26", "pandas>=2.2"]
keywords = ["backtest", "a-share", "china", "quant", "trading"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
baostock = ["baostock"]

[project.urls]
Homepage = "https://github.com/Issac250/ashare-bt"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_bt"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
